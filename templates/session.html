<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SleepGuard — Live drowsiness monitoring session with real-time webcam analysis.">
    <title>SleepGuard — Live Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ── Navbar ──────────────────────────────────────────────────── -->
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <span class="logo-icon">🛡️</span>
                SleepGuard
            </a>
            <ul class="navbar-nav">
                <li><a href="/" id="nav-dashboard">Dashboard</a></li>
                <li><a href="/session" class="active" id="nav-session">Live Monitor</a></li>
            </ul>
        </div>
    </nav>

    <!-- ── Monitoring Content ──────────────────────────────────────── -->
    <main class="container">
        <div class="monitoring-grid fade-in">

            <!-- ── Video Feed Column ──────────────────────────────── -->
            <div>
                <div class="video-container" id="video-container">
                    <img src="{{ url_for('video_feed') }}"
                         alt="Live camera feed"
                         id="video-feed">

                    <div class="video-overlay">
                        <span class="live-indicator">
                            <span class="live-dot"></span>
                            LIVE
                        </span>
                    </div>

                    <div class="video-overlay-bottom">
                        <span class="badge badge--alert" id="status-badge">
                            <span class="badge-dot"></span>
                            ALERT
                        </span>
                        <span style="font-family: var(--font-mono); font-size: 0.8rem; color: #94a3b8;"
                              id="fps-display">— FPS</span>
                    </div>
                </div>

                <!-- Session controls -->
                <div class="flex items-center justify-between mt-2">
                    <div class="session-timer" id="session-timer">00:00:00</div>
                    <div class="flex gap-1">
                        <button class="btn btn-outline" id="btn-test-alarm" title="Test audio beep sound">🔊 Test Alarm</button>
                        <button class="btn btn-primary" id="btn-start-session">▶ Start</button>
                        <button class="btn btn-danger" id="btn-stop-session" disabled>■ Stop</button>
                    </div>
                </div>
            </div>

            <!-- ── Sidebar: Live Stats ────────────────────────────── -->
            <div class="monitoring-sidebar slide-in">

                <!-- Identified Driver Card -->
                <div class="card" id="driver-identity-card">
                    <div class="card-header">
                        <h3 class="card-title">Driver Identity</h3>
                        <span class="badge badge--alert" id="driver-status-badge" style="background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3);">
                            <span class="badge-dot" style="background: #facc15;"></span>
                            VERIFYING
                        </span>
                    </div>
                    <div class="flex items-center gap-1 mt-1">
                        <div style="font-size: 1.8rem; background: rgba(30, 41, 59, 0.8); padding: 8px 12px; border-radius: 8px;">👤</div>
                        <div>
                            <div style="font-weight: 700; font-size: 1.1rem; color: #f8fafc;" id="driver-name-display">Unknown Driver</div>
                            <div style="font-size: 0.85rem; color: #94a3b8;" id="driver-phone-display">N/A</div>
                        </div>
                    </div>
                </div>

                <!-- Current State -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Current State</h3>
                        <span class="badge badge--alert" id="sidebar-state">
                            <span class="badge-dot"></span>
                            ALERT
                        </span>
                    </div>
                    <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="stat-card">
                            <div class="stat-value" id="ear-value">—</div>
                            <div class="stat-label">EAR</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="mar-value">—</div>
                            <div class="stat-label">MAR</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="pitch-value">—</div>
                            <div class="stat-label">Pitch</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="yaw-value">—</div>
                            <div class="stat-label">Yaw</div>
                        </div>
                    </div>
                </div>

                <!-- Session Stats -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Session Stats</h3>
                    </div>
                    <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="stat-card">
                            <div class="stat-value" id="blink-count">0</div>
                            <div class="stat-label">Blinks</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="yawn-count">0</div>
                            <div class="stat-label">Yawns</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="nod-count">0</div>
                            <div class="stat-label">Nods</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="alert-count">0</div>
                            <div class="stat-label">Alerts</div>
                        </div>
                    </div>
                </div>

                <!-- Confidence Gauge -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Confidence</h3>
                        <span class="text-muted" style="font-size: 0.8rem;" id="confidence-pct">0%</span>
                    </div>
                    <div style="background: var(--border); border-radius: 9999px; height: 8px; overflow: hidden;">
                        <div id="confidence-bar"
                             style="height: 100%; width: 0%; background: var(--success); border-radius: 9999px; transition: width 0.4s ease, background 0.4s ease;">
                        </div>
                    </div>
                </div>

                <!-- EAR Chart (Phase 8 — placeholder) -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">EAR Trend</h3>
                    </div>
                    <div class="chart-container" id="ear-chart-container">
                        <canvas id="ear-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/monitoring.js') }}"></script>
</body>
</html>
