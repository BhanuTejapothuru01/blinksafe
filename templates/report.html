<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SleepGuard — Session report with event timeline and detection charts.">
    <title>SleepGuard — Session Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ── Navbar ──────────────────────────────────────────────────── -->
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <span class="logo-icon">🛡️</span>
                SleepGuard
            </a>
            <ul class="navbar-nav">
                <li><a href="/" id="nav-dashboard">Dashboard</a></li>
                <li><a href="/session" id="nav-session">Live Monitor</a></li>
            </ul>
        </div>
    </nav>

    <!-- ── Report Content ──────────────────────────────────────────── -->
    <main class="container" style="padding-top: 2rem;" data-session-id="{{ session_id }}">
        <!-- Header -->
        <div class="flex items-center justify-between mb-2">
            <div>
                <h1 style="font-size: 1.75rem; font-weight: 800;">Session #{{ session_id }} Report</h1>
                <div style="font-size: 0.95rem; color: #f8fafc; font-weight: 600; margin-top: 0.2rem;" id="report-driver-name">👤 Driver: Loading...</div>
                <span class="text-muted" id="report-date" style="font-size:0.8rem;">Recorded session summary</span>
            </div>
            <a href="/" class="btn btn-outline">← Back to Dashboard</a>
        </div>

        <!-- Recommendation Banner -->
        <div class="card mb-2" id="recommendation-card" style="border-left: 4px solid var(--primary);">
            <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem;" id="risk-level-title">
                Analyzing session...
            </div>
            <p id="recommendation-text" style="color: var(--text-muted); font-size: 0.95rem;">
                Loading recommendations...
            </p>
        </div>

        <!-- Metrics Overview Grid -->
        <div class="stats-grid mb-2">
            <div class="stat-card">
                <div class="stat-value" id="rep-duration">—</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rep-safety">—</div>
                <div class="stat-label">Safety Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rep-drowsy">0</div>
                <div class="stat-label">Drowsy Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rep-danger">0</div>
                <div class="stat-label">Danger Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rep-yawns">0</div>
                <div class="stat-label">Yawns</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rep-blinks">0</div>
                <div class="stat-label">Blinks</div>
            </div>
        </div>

        <!-- Timeline Chart Card -->
        <div class="card mb-2">
            <div class="card-header">
                <h2 class="card-title">Session Alertness Timeline</h2>
            </div>
            <div style="height: 320px; position: relative;">
                <canvas id="timeline-chart"></canvas>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
</body>
</html>
